name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build & tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SnapBack.sln

      - name: Build
        run: dotnet build SnapBack.sln -c Release --no-restore

      - name: Test (unit + Windows integration)
        env:
          SNAPBACK_TEST_PURGE: '1'
        run: dotnet test SnapBack.sln -c Release --no-build --logger "trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish (smoke test)
        shell: pwsh
        run: |
          dotnet publish src/SnapBack.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/SnapBack
          dotnet publish src/SnapBack.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/SnapBack
          Get-ChildItem publish/SnapBack
          # The GUI and the CLI must be distinct files (Windows file names are case-insensitive).
          foreach ($exe in 'SnapBack.exe', 'snapback-cli.exe') {
            if (-not (Test-Path "publish/SnapBack/$exe")) { throw "$exe is missing" }
          }
          if ((Get-Item publish/SnapBack/SnapBack.exe).VersionInfo.OriginalFilename -ne 'SnapBack.dll') { throw "SnapBack.exe is not the GUI" }
          # The release also ships ARM64 builds: make sure they publish.
          dotnet publish src/SnapBack.App -c Release -r win-arm64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/arm64
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 publish of the app failed' }
          dotnet publish src/SnapBack.Cli -c Release -r win-arm64 --self-contained -p:PublishSingleFile=true -o publish/arm64
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 publish of the CLI failed' }
          Get-ChildItem publish/arm64 -Filter *.exe | Format-Table Name, Length

      - name: CLI smoke test
        shell: pwsh
        env:
          SNAPBACK_DATA_DIR: ${{ runner.temp }}\snapback-ci
        run: |
          $exe = "./publish/SnapBack/snapback-cli.exe"
          $commands = @(
            @('--version'),
            @('status'),
            @('baseline', 'create'),
            @('baseline', 'show'),
            @('list', '--all'),
            @('preview', '--include-caution', '--include-review'),
            @('history'),
            @('memory'),
            @('status', '--json'),
            @('profile', 'create', 'Work'),
            @('profile', 'rename', 'Work', 'Gaming'),
            @('profile', 'use', 'Gaming'),
            @('profile', 'default', 'Gaming'),
            @('profiles'),
            @('status', '--profile', 'Gaming'),
            @('rules'),
            @('env'),
            @('profile', 'delete', 'Gaming', '--yes'),
            @('profiles', '--json')
          )
          foreach ($c in $commands) {
            Write-Host "> snapback-cli $c"
            & $exe @c
            if ($LASTEXITCODE -ne 0) { throw "snapback-cli $c failed with exit code $LASTEXITCODE" }
          }
          # Rules can never target a protected process.
          & $exe rule close explorer
          if ($LASTEXITCODE -ne 2) { throw "A rule was accepted for a protected process (exit code $LASTEXITCODE)" }
          $global:LASTEXITCODE = 0

      - name: GUI smoke test — English (sorting, Memory window, live switch to Russian)
        shell: pwsh
        env:
          SNAPBACK_DATA_DIR: ${{ runner.temp }}\snapback-ui-en
        run: |
          ./publish/SnapBack/snapback-cli.exe baseline create
          $extra = @(
            Start-Process notepad.exe -PassThru
            Start-Process ./tests/SnapBack.TestTarget/bin/Release/net10.0-windows/SnapBack.TestTarget.exe -ArgumentList normal -PassThru
          )
          try {
            ./ci/ui-smoke.ps1 -Exe ./publish/SnapBack/SnapBack.exe -DataDir $env:SNAPBACK_DATA_DIR -Language en `
              -Expect 'Return to baseline', 'New since baseline', 'Memory', 'Make current state the baseline' `
              -Interact -SwitchTo 'Русский' -ExpectAfterSwitch 'Вернуть к baseline', 'Новые после baseline', 'Память'
          } finally {
            $extra | Where-Object { $_ -and -not $_.HasExited } | ForEach-Object { Stop-Process -Id $_.Id -Force }
          }

      - name: GUI smoke test — Russian
        shell: pwsh
        run: |
          ./ci/ui-smoke.ps1 -Exe ./publish/SnapBack/SnapBack.exe -DataDir "$env:RUNNER_TEMP/snapback-ui-ru" -Language ru `
            -Expect 'Вернуть к baseline', 'Новые после baseline', 'Сделать текущее состояние базовым', 'Настройки'

      - name: GUI smoke test — Simplified Chinese (and live switch to English)
        shell: pwsh
        run: |
          ./ci/ui-smoke.ps1 -Exe ./publish/SnapBack/SnapBack.exe -DataDir "$env:RUNNER_TEMP/snapback-ui-zh" -Language zh-CN `
            -Expect '返回基线', '基线之后新增', '将当前状态设为基线', '设置' `
            -SwitchTo 'English' -ExpectAfterSwitch 'Return to baseline', 'Settings'

      - name: Deep Memory Cleanup helper (elevated runner)
        shell: pwsh
        env:
          SNAPBACK_DATA_DIR: ${{ runner.temp }}\snapback-helper
        run: |
          ./publish/SnapBack/snapback-cli.exe memory
          $ok = Start-Process ./publish/SnapBack/SnapBack.exe -ArgumentList '--deep-cleanup', 'low-priority' -Wait -PassThru
          if ($ok.ExitCode -ne 0) { throw "Helper failed with exit code $($ok.ExitCode)" }
          $bad = Start-Process ./publish/SnapBack/SnapBack.exe -ArgumentList '--deep-cleanup', 'empty-working-sets' -Wait -PassThru
          if ($bad.ExitCode -ne 23) { throw "Helper accepted a forbidden request (exit code $($bad.ExitCode))" }
          ./publish/SnapBack/snapback-cli.exe memory --json
          Get-ChildItem "$env:SNAPBACK_DATA_DIR/logs" -Filter *.log | Get-Content

      - name: Tray, autostart and background resource usage
        shell: pwsh
        run: |
          ./ci/tray-smoke.ps1 -Exe ./publish/SnapBack/SnapBack.exe -DataDir "$env:RUNNER_TEMP/snapback-tray" -IdleSeconds 60

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SnapBack-win-x64
          path: publish/SnapBack

  portable-tests:
    name: Portable tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Core tests
        run: dotnet test tests/SnapBack.Core.Tests -c Release

      - name: Native layout tests
        run: dotnet test tests/SnapBack.Windows.Tests -c Release
