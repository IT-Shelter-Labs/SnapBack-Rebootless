name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build & tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SnapBack.sln

      - name: Build
        run: dotnet build SnapBack.sln -c Release --no-restore

      - name: Test (unit + Windows integration)
        run: dotnet test SnapBack.sln -c Release --no-build --logger "trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish (smoke test)
        shell: pwsh
        run: |
          dotnet publish src/SnapBack.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/SnapBack
          dotnet publish src/SnapBack.Cli -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/SnapBack
          Get-ChildItem publish/SnapBack

      - name: CLI smoke test
        shell: pwsh
        env:
          SNAPBACK_DATA_DIR: ${{ runner.temp }}\snapback-ci
        run: |
          $exe = "./publish/SnapBack/snapback.exe"
          $commands = @(
            @('--version'),
            @('status'),
            @('baseline', 'create'),
            @('baseline', 'show'),
            @('list', '--all'),
            @('preview', '--include-caution', '--include-review'),
            @('history')
          )
          foreach ($c in $commands) {
            Write-Host "> snapback $c"
            & $exe @c
            if ($LASTEXITCODE -ne 0) { throw "snapback $c failed with exit code $LASTEXITCODE" }
          }

      - name: GUI smoke test (window starts and analyzes without errors)
        shell: pwsh
        env:
          SNAPBACK_DATA_DIR: ${{ runner.temp }}\snapback-gui
        run: |
          # A baseline plus a few apps started afterwards, so the lists are not empty.
          ./publish/SnapBack/snapback.exe baseline create
          $extra = @(
            Start-Process notepad.exe -PassThru
            Start-Process ./tests/SnapBack.TestTarget/bin/Release/net10.0-windows/SnapBack.TestTarget.exe -ArgumentList normal -PassThru
          )
          $p = Start-Process ./publish/SnapBack/SnapBack.exe -PassThru
          Start-Sleep -Seconds 20
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            New-Item -ItemType Directory -Force screenshots | Out-Null
            $bmp.Save("screenshots/main-window.png")
          } catch { Write-Host "Screenshot failed: $_" }
          $extra | Where-Object { $_ -and -not $_.HasExited } | ForEach-Object { Stop-Process -Id $_.Id -Force }
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          $log = Get-Content "$env:SNAPBACK_DATA_DIR\logs\*.log" -Raw
          Write-Host $log
          if (-not $alive) { throw "SnapBack exited unexpectedly (exit code $($p.ExitCode))" }
          if ($log -match '\[(ERR|CRT)\]') { throw "Errors were logged" }

      - name: Automatic baseline smoke test (headless mode)
        shell: pwsh
        env:
          SNAPBACK_DATA_DIR: ${{ runner.temp }}\snapback-auto
        run: |
          New-Item -ItemType Directory -Force $env:SNAPBACK_DATA_DIR | Out-Null
          '{ "autoBaselineOnSignIn": true, "autoBaselineMinDelaySeconds": 0, "autoBaselineQuietSeconds": 10 }' | Set-Content "$env:SNAPBACK_DATA_DIR\settings.json"
          $p = Start-Process ./publish/SnapBack/SnapBack.exe -ArgumentList '--auto-baseline' -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw "--auto-baseline did not finish" }
          Get-Content "$env:SNAPBACK_DATA_DIR\logs\*.log"
          if (-not (Test-Path "$env:SNAPBACK_DATA_DIR\baseline.json")) { throw "No baseline was created" }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SnapBack-win-x64
          path: publish/SnapBack

  portable-tests:
    name: Portable tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Core tests
        run: dotnet test tests/SnapBack.Core.Tests -c Release

      - name: Native layout tests
        run: dotnet test tests/SnapBack.Windows.Tests -c Release
