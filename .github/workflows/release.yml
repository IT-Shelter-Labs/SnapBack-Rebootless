name: Release

on:
  push:
    tags: ['v*']
  # Manual release from the Actions tab: creates the tag on the checked-out commit.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0 (must match <Version> and CHANGELOG.md)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check version
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Invalid version '$version'" }
          if (git ls-remote --tags origin "refs/tags/$env:TAG") { if ("${{ github.event_name }}" -eq 'workflow_dispatch') { throw "Tag $env:TAG already exists" } }
          $declared = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($declared -ne $version) { throw "Tag $version does not match <Version>$declared</Version> in Directory.Build.props" }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]" -Quiet)) { throw "CHANGELOG.md has no entry for $version" }

      - name: Test
        run: dotnet test SnapBack.sln -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          foreach ($rid in @('win-x64', 'win-arm64')) {
            $out = "publish/SnapBack-$version-$rid"
            dotnet publish src/SnapBack.App -c Release -r $rid --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version -o $out
            if ($LASTEXITCODE -ne 0) { throw "publish App $rid failed" }
            dotnet publish src/SnapBack.Cli -c Release -r $rid --self-contained -p:PublishSingleFile=true -p:Version=$version -o $out
            if ($LASTEXITCODE -ne 0) { throw "publish Cli $rid failed" }
            Remove-Item "$out/*.pdb" -ErrorAction SilentlyContinue
            Copy-Item README.md, README.ru.md, README.zh-CN.md, LICENSE, CHANGELOG.md -Destination $out
            New-Item -ItemType Directory -Path "$out/docs/images" -Force | Out-Null
            Copy-Item docs/SAFETY.md, docs/ARCHITECTURE.md -Destination "$out/docs"
            Copy-Item docs/images/snapback-dashboard-ru.png -Destination "$out/docs/images"

            # Sanity checks of the package.
            foreach ($exe in 'SnapBack.exe', 'snapback-cli.exe') {
              if (-not (Test-Path "$out/$exe")) { throw "$exe missing in $rid package" }
            }
            $info = (Get-Item "$out/SnapBack.exe").VersionInfo
            if ($info.OriginalFilename -ne 'SnapBack.dll') { throw "SnapBack.exe is not the GUI ($rid)" }
            if (-not $info.ProductVersion.StartsWith($version)) { throw "SnapBack.exe has version $($info.ProductVersion), expected $version" }
            if ($rid -eq 'win-x64') {
              $cliVersion = (& "$out/snapback-cli.exe" --version | Out-String).Trim()
              if (-not $cliVersion.StartsWith($version)) { throw "snapback-cli reports '$cliVersion', expected $version" }
              Write-Host "snapback-cli --version: $cliVersion"
            }

            Get-ChildItem $out | Format-Table Name, Length
            Compress-Archive -Path "$out/*" -DestinationPath "publish/SnapBack-$version-$rid.zip"
          }
          Get-FileHash publish/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content publish/SHA256SUMS.txt
          Get-Content publish/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $notes = "docs/release-notes/$tag.md"
          # --target creates the tag on the tested commit when it does not exist yet (manual release).
          $assets = @((Get-ChildItem publish -Filter 'SnapBack-*.zip').FullName) + (Resolve-Path publish/SHA256SUMS.txt).Path
          if ($assets.Count -ne 3) { throw "Expected 2 packages and SHA256SUMS.txt, found: $assets" }
          $common = @($tag) + $assets + @('--title', "SnapBack $tag", '--target', '${{ github.sha }}')
          if (Test-Path $notes) {
            gh release create @common --notes-file $notes
          } else {
            gh release create @common --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
